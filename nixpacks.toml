[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "cd backend && npm ci --only=production=false",
  "cd ../frontend && npm ci --only=production=false"
]

[phases.build]
cmds = [
  "cd frontend && npx vite build",
  "cd ../backend && npx tsc"
]

[start]
cmd = "cd backend && node dist/index.js"
